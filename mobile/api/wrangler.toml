name = "tls-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Non-secret config. Secrets (CLERK_SECRET_KEY, TURSO_*, UPSTASH_*, GEMINI_API_KEY, RESEND_*)
# go in .dev.vars for local dev and `wrangler secret put <NAME>` for production.
[vars]
GEMINI_MODEL = "gemini-3.1-flash-lite"

# Post photos / videos (PUT /posts/:id/media, served at GET /media/<key>).
# Production needs the bucket to exist: `wrangler r2 bucket create tls-media` (R2 must be enabled on the account).
# `wrangler dev` uses a local simulated bucket under .wrangler/state instead, so no bucket is needed for local dev.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "tls-media"

[observability]
enabled = true
