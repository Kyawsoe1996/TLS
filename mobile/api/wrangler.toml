name = "magicktls"
main = "src/index.ts"
# Deploys go to the company Cloudflare account ("globalmagicko", owner of generalmagickindustries.com).
account_id = "8314c07597ec8a9c204b07aa50064c25"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Custom domain for the API, privacy and support pages (the zone is on this Cloudflare account, so
# `wrangler deploy` creates the DNS record and certificate). The workers.dev URL keeps working too.
routes = [{ pattern = "api.magicktls.generalmagickindustries.com", custom_domain = true }]

# Non-secret config. Secrets (CLERK_SECRET_KEY, TURSO_*, UPSTASH_*, GEMINI_API_KEY, RESEND_*, S3_ACCESS_KEY_ID,
# S3_SECRET_ACCESS_KEY) go in .dev.vars for local dev and `wrangler secret put <NAME>` for production.
[vars]
GEMINI_MODEL = "gemini-3.1-flash-lite"
# Origin baked into the media links the API hands to the app. Must be set because `wrangler dev` rewrites
# request URLs to the custom domain above; .dev.vars overrides it with http://localhost:8787 locally.
PUBLIC_URL = "https://api.magicktls.generalmagickindustries.com"
# Post photos / videos (PUT /posts/:id/media, served at GET /media/<key>) live in the company's Amazon S3
# bucket, under S3_PREFIX. The access keys are secrets (above); .dev.vars overrides these three locally
# (S3_PREFIX = "magicktls/dev" there, so local uploads never mix with production files). Leave any of the
# S3_* values unset and the API deploys with media switched off (uploads answer 400, media links 404).
S3_BUCKET = "magicktls"
S3_REGION = "ap-southeast-7"
S3_PREFIX = "magicktls/prod"

[observability]
enabled = true
